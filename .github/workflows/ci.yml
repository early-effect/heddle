name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - "main"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      modules: ${{ steps.affected.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: early-effect/histos/.github/actions/setup@af16c748b1cc2cb95b936aaae601f900679c9ef2 # af16c748b1cc2cb95b936aaae601f900679c9ef2
      - run: ./histos doctor --preflight affected
      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=all
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            last=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&status=success&branch=${GITHUB_REF_NAME}&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)
            if [ -n "$last" ] && git merge-base --is-ancestor "$last" HEAD; then
              base="$last"
            fi
          fi
          modules=$(./histos affected --base "$base" || echo '["all"]')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
  test:
    needs: affected
    if: "(github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (!cancelled() && !contains(needs.*.result, 'failure'))"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: early-effect/histos/.github/actions/setup@af16c748b1cc2cb95b936aaae601f900679c9ef2 # af16c748b1cc2cb95b936aaae601f900679c9ef2
      - run: ./histos doctor --preflight test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "25"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llvm
        with:
          path: "${{ runner.temp }}/llvm"
          key: "llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}"
      - run: |
          dir="${{ runner.temp }}/llvm"
          if [ "${{ steps.llvm.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$dir"
            curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-Linux-X64.tar.xz" -o "$dir/llvm.tar.xz"
            expected="b3b7f2801d15d50736acea3c73982994d025b01c2f035b91ae3b49d1b575732b"
            got=$(openssl dgst -sha256 "$dir/llvm.tar.xz" | awk '{print $NF}')
            [ "$got" = "$expected" ] || { echo "llvm checksum mismatch" >&2; exit 1; }
            tar -xJf "$dir/llvm.tar.xz" -C "$dir" --strip-components=1
            rm "$dir/llvm.tar.xz"
          fi
          test -x "$dir/bin/clang"
          echo "$dir/bin" >> "$GITHUB_PATH"
          if [ -n "$LD_LIBRARY_PATH" ]; then
            echo "LD_LIBRARY_PATH=$dir/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          else
            echo "LD_LIBRARY_PATH=$dir/lib" >> "$GITHUB_ENV"
          fi
      - name: Install native link libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libstdc++-12-dev libgc-dev libunwind-dev libssl-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright
        with:
          path: |
            ~/.cache/chekhov/playwright/1.62.1
            ~/.cache/ms-playwright
          key: "playwright-1.62.1-${{ runner.os }}-${{ runner.arch }}"
      - run: |
          dir="$HOME/.cache/chekhov/playwright/1.62.1"
          if [ "${{ steps.playwright.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$dir"
            npm install --prefix "$dir" --no-fund --no-audit --no-progress playwright@1.62.1
            node "$dir/node_modules/playwright/cli.js" install chromium firefox webkit
          fi
          test -d "$dir/node_modules/playwright"
          find /etc/apt -type f -print0 | xargs -0 -r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'
          timeout 180s node "$dir/node_modules/playwright/cli.js" install-deps chromium firefox webkit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/coursier/v1"
          key: "coursier-${{ hashFiles('histos.scala') }}-${{ runner.os }}-${{ runner.arch }}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: store
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
      - run: "./histos test --affected '${{ needs.affected.outputs.modules }}'"
        env:
          HISTOS_CACHE_NAMESPACE: "${{ case(github.event_name == 'pull_request', format('pr/{0}', github.event.pull_request.number), 'main') }}"
          HISTOS_CACHE_MODE: "write"
      - if: "always()"
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_KEY: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
        run: |
          if [ "${{ steps.store.outputs.cache-hit }}" = "true" ]; then
            gh api --method DELETE /repos/${GITHUB_REPOSITORY}/actions/caches?key=${STORE_KEY}
          fi
      - if: "always()"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
  versions:
    if: "github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'"
    needs: [affected]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: early-effect/histos/.github/actions/setup@af16c748b1cc2cb95b936aaae601f900679c9ef2 # af16c748b1cc2cb95b936aaae601f900679c9ef2
      - run: ./histos doctor --preflight versions
      - run: "./histos run versions"
  compatibility:
    if: "github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'"
    needs: [affected]
