      - run: "./histos run dev.earlyeffect.specular/site"
      - if: "github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "target/site"
  pages:
    needs: [docs, affected, workflow, supply-chain, test, versions, compatibility, scaladoc, format, js, native, browsers, browser-check]
    if: "(github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  cache-seed:
    needs: [affected]
    if: "github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: early-effect/histos/.github/actions/setup@af16c748b1cc2cb95b936aaae601f900679c9ef2 # af16c748b1cc2cb95b936aaae601f900679c9ef2
      - run: ./histos doctor --preflight cache-seed
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "25"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llvm
        with:
          path: "${{ runner.temp }}/llvm"
          key: "llvm-21.1.8-${{ runner.os }}-${{ runner.arch }}"
      - run: |
          dir="${{ runner.temp }}/llvm"
          if [ "${{ steps.llvm.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$dir"
            curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-Linux-X64.tar.xz" -o "$dir/llvm.tar.xz"
            expected="b3b7f2801d15d50736acea3c73982994d025b01c2f035b91ae3b49d1b575732b"
            got=$(openssl dgst -sha256 "$dir/llvm.tar.xz" | awk '{print $NF}')
            [ "$got" = "$expected" ] || { echo "llvm checksum mismatch" >&2; exit 1; }
            tar -xJf "$dir/llvm.tar.xz" -C "$dir" --strip-components=1
            rm "$dir/llvm.tar.xz"
          fi
          test -x "$dir/bin/clang"
          echo "$dir/bin" >> "$GITHUB_PATH"
          if [ -n "$LD_LIBRARY_PATH" ]; then
            echo "LD_LIBRARY_PATH=$dir/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          else
            echo "LD_LIBRARY_PATH=$dir/lib" >> "$GITHUB_ENV"
          fi
      - name: Install native link libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libstdc++-12-dev libgc-dev libunwind-dev libssl-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright
        with:
          path: |
            ~/.cache/chekhov/playwright/1.62.1
            ~/.cache/ms-playwright
          key: "playwright-1.62.1-${{ runner.os }}-${{ runner.arch }}"
      - run: |
          dir="$HOME/.cache/chekhov/playwright/1.62.1"
          if [ "${{ steps.playwright.outputs.cache-hit }}" != "true" ]; then
            mkdir -p "$dir"
            npm install --prefix "$dir" --no-fund --no-audit --no-progress playwright@1.62.1
            node "$dir/node_modules/playwright/cli.js" install chromium firefox webkit
          fi
          test -d "$dir/node_modules/playwright"
          find /etc/apt -type f -print0 | xargs -0 -r sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'
          timeout 180s node "$dir/node_modules/playwright/cli.js" install-deps chromium firefox webkit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/coursier/v1"
          key: "coursier-${{ hashFiles('histos.scala') }}-${{ runner.os }}-${{ runner.arch }}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: store
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
      - run: "./histos compile"
        env:
          HISTOS_CACHE_NAMESPACE: "main"
          HISTOS_CACHE_MODE: "write"
      - if: "always()"
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_KEY: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
        run: |
          if [ "${{ steps.store.outputs.cache-hit }}" = "true" ]; then
            gh api --method DELETE /repos/${GITHUB_REPOSITORY}/actions/caches?key=${STORE_KEY}
          fi
      - if: "always()"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/histos"
          key: "histos-store-${{ case(github.event_name == 'pull_request', format('pr-{0}', github.event.pull_request.number), 'main') }}-${{ runner.os }}-${{ runner.arch }}"
  workflow:
    if: "github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'"
    needs: [affected]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
      - run: git remote set-head origin --auto
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: early-effect/histos/.github/actions/setup@af16c748b1cc2cb95b936aaae601f900679c9ef2 # af16c748b1cc2cb95b936aaae601f900679c9ef2
      - run: ./histos doctor --preflight workflow
      - run: "./histos compile heddle brotli oauth mcpProtocol mcp mcpApps mcpAppsHost opentelemetry --platform jvm"
      - run: ./histos doctor --area release
      - run: ./histos doctor
        env:
          GH_TOKEN: ${{ github.token }}
      - run: "./histos workflow --check"
